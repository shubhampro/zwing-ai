name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH secrets exist
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "MISSING secret: $name (set under Settings → Secrets and variables → Actions)"
              missing=1
            else
              val="${!name}"
              echo "OK secret: $name (value length: ${#val})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! printf '%s' "$SSH_PRIVATE_KEY" | head -n1 | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "SSH_PRIVATE_KEY does not look like a private key (missing BEGIN line)"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          debug: true
          envs: DEPLOY_PATH,DEPLOY_BRANCH
          script: |
            set -euo pipefail

            export COMPOSER_ALLOW_SUPERUSER=1
            export COMPOSER_NO_INTERACTION=1

            APP_DIR="${DEPLOY_PATH:-/var/www/zwing-ai}"
            BRANCH="${DEPLOY_BRANCH:-main}"

            cd "$APP_DIR"

            echo "==> Deploy $(hostname) ${APP_DIR} @ ${BRANCH}"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/${BRANCH}"

            if ! php -m | grep -qi '^mongodb$'; then
              echo "ERROR: PHP ext-mongodb missing. On server run:"
              echo "  sudo apt-get install -y php8.4-mongodb && sudo systemctl reload php8.4-fpm"
              exit 1
            fi

            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            php artisan package:discover --ansi
            # Stale route/config cache makes Wayfinder omit new routes during vite build.
            php artisan optimize:clear --no-interaction

            export NVM_DIR="${HOME}/.nvm"
            if [ -s "${NVM_DIR}/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "${NVM_DIR}/nvm.sh"
            fi
            hash -r
            command -v npm >/dev/null || {
              echo "ERROR: npm not found in non-interactive PATH. Install Node or fix nvm."
              echo "PATH=${PATH}"
              exit 1
            }

            npm ci
            php artisan wayfinder:generate --no-interaction
            npm run build
            php artisan migrate --force
            php artisan optimize
            php artisan queue:restart

            if command -v systemctl >/dev/null 2>&1; then
              sudo -n systemctl reload php8.4-fpm 2>/dev/null || true
            fi

            echo "==> Deploy done: $(git rev-parse --short HEAD)"
